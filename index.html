        { k: "贵金属", v: "金 10 月 −7.21% 为 2008 年来最差、银 −18.87%——加息预期主导，全球利率上行压制资本开支节奏，对厂房融资环境是逆风" },
        { k: "算力基建", v: "亚马逊 800 亿担保 + 英伟达担保 Nscale = 融资资产化；黑石给 Anthropic 双 B = 信用分层开始——有租约的机房资产与无租约的，融资成本将快速拉开" }

  recent: [
    { topic: "油价与 11 月 4 日窗口", since: "10 月下旬", trend: "up", status: "布油 117.64 创半年新高、连续四月收涨；特朗普拟选举次日恢复对伊打击，INE 夜盘 +4.25%" },
    { topic: "水泥错峰执行", since: "11 月 1 日", trend: "up", status: "重庆 92+X 今天生效（执行率待观察）；川内内江 +30、自贡 +20 接力；成都熟料 390 全国最高" },
    { topic: "煤价磨底", since: "10 月下旬", trend: "down", status: "港口 5500 千元附近续探、秦港场存 595 万吨；六大电厂日耗 81.74 万吨未起，等供暖点火" },
    { topic: "钢市等政策", since: "10 月下旬", trend: "flat", status: "夜盘涨少跌多、焦煤跌超 2%、螺纹持续减仓；焦炭第二轮提降在途，看冬储与下月初文件" },
    { topic: "政策利率换锚", since: "11 月 2 日", trend: "up", status: "隔夜逆回购 1.25% 每日操作，短端定价基准切换；厂房融资合同定价条款需重新核对" },
    { topic: "AI 资金链分层", since: "10 月 31 日", trend: "down", status: "亚马逊 800 亿担保融资、英伟达担保 460 兆瓦数据中心；黑石或给 Anthropic 双 B 评级" },
    { topic: "1500 个老旧厂区", since: "10 月下旬", trend: "up", status: "五部门 20 项明确老旧厂区功能转换与厂房改体育空间；中央预算内 970 亿 + 专项债超 2500 亿" },
    { topic: "成品油下一轮", since: "10 月 29 日", trend: "flat", status: "已兑现 +345/+335（少涨 95/85）；燃油附加费 11 月 5 日 +30/+50；下一轮窗口 11 月 12 日 24 时" }
  ],

  foreign: {
    note: "外媒原文对照，按来源分组；中文为编辑译述，观点归属原媒体。",
    bloomberg: [
      { en: "Amazon has set up a financing arrangement of up to $80 billion backed by purchased hardware, as its total future purchase commitments swell to $883 billion, more than double a year earlier.", zh: "亚马逊设立以所购硬件作担保、最高 800 亿美元的融资安排；其未来支出承诺总额增至 8830 亿美元、为去年同期两倍多。", tone: "融资创新" },
      { en: "Blackstone has told investors that Anthropic is unlikely to win an investment-grade rating immediately after listing and is more likely to be rated double-B or above, a shift from earlier expectations.", zh: "黑石已告知投资者，Anthropic 上市后不太可能立即获得投资级评级、更可能为双 B 级或以上，较此前预期发生转变。", tone: "信用分层" },
      { en: "Oil is on track for a fourth straight monthly gain, with Brent's December contract settling near $118 before expiry and the more-active January contract closing near $113.43.", zh: "油价势将连续第四个月收涨：布伦特 12 月合约到期前结算接近 118 美元，更活跃的 1 月合约收于 113.43 美元附近。", tone: "油价续涨" },
      { en: "Copper fell to a one-week low as the technology selloff and rising crude stoked concern about global growth, with LME copper closing 1.58% lower at $14,130 a ton.", zh: "科技股抛售与油价上涨引发全球增长担忧，伦铜收跌 1.58% 至 14130 美元/吨、创一周低点。", tone: "需求担忧" }
    ],
    reuters: [
      { en: "US President Donald Trump plans to resume strikes on Iran the day after the November 3 midterm elections, and Gulf states have been told to prepare for possible action as early as November 4.", zh: "特朗普计划在 11 月 3 日中期选举次日恢复对伊朗打击，海湾国家被告知为最早 11 月 4 日的行动做好准备。", tone: "地缘升级" },
      { en: "Ukraine has paused attacks on Russian refineries under pressure from Washington, and the halt is expected to last beyond the US midterm elections, sources familiar with the matter said.", zh: "知情人士称，在华盛顿施压下乌克兰已暂停袭击俄罗斯炼厂，预计暂停将持续到美国中期选举之后。", tone: "供给缓和" },
      { en: "Gold plunged below $3,900 an ounce and was on track for its worst month since 2008 as hawkish Federal Reserve commentary lifted rate expectations; silver lost more than 6%.", zh: "黄金跌破每盎司 3900 美元、势创 2008 年以来最差单月表现，美联储鹰派表态推升加息预期；白银跌超 6%。", tone: "贵金属崩跌" },
      { en: "China's central bank said it will conduct overnight reverse repo operations every business day from November 2 at a fixed rate of 1.25%, formally re-anchoring its policy rate framework.", zh: "中国央行公告 11 月 2 日起每个工作日开展隔夜逆回购操作、固定利率 1.25%，政策利率框架正式换锚。", tone: "货币换锚" }
    ],
    cnbc: [
      { en: "The Nasdaq slid 2.86% to 25,437 on Friday, with the Philadelphia Semiconductor Index tumbling 7.2% — its worst day since June; Intel lost 28.58%, its worst session in over four decades.", zh: "纳指周五跌 2.86% 报 25437 点，费城半导体指数暴跌 7.2%、为 6 月以来最大单日跌幅；英特尔跌 28.58%、为四十多年来最差单日。", tone: "芯片重挫" },
      { en: "Kioxia posted record quarterly revenue but guided the current quarter well below estimates, dragging memory names from SanDisk, down more than 13%, to SK Hynix, off nearly 8%.", zh: "铠侠季度营收创纪录但本季指引远低于预期，拖累闪迪（跌超 13%）到 SK 海力士（跌近 8%）的存储板块全线重挫。", tone: "存储回调" },
      { en: "South Korea's Kospi plunged 3.48%, triggering the market's sidecar mechanism intraday, and has lost more than 16% in October as the global memory selloff deepened.", zh: "韩国综指暴跌 3.48%、盘中触发「侧车机制」，随全球存储股抛售加深、10 月累计跌超 16%。", tone: "亚太共振" },
      { en: "The Bank of Japan held rates at 1.25% and judged for the first time since 2013 that underlying inflation has reached its 2% target, while pledging to accelerate its ETF sales.", zh: "日本央行维持利率 1.25%，并自 2013 年以来首次认定基础通胀已达到 2% 目标，同时承诺加快 ETF 抛售。", tone: "退出宽松" }
    ]
  },

  footer: {
    note: "信息整理与创作参考 · 不构成任何投资与工程决策建议。价格数据以各机构当日发布口径为准。",
    sources: "中国人民银行 / 国家发改委 / 国家能源局 / 住建部 / 商务部 / 金融监管总局 / 市场监管总局 / Mysteel / 中钢网 / 百年建筑网 / 水泥网数据 / CCI 中国煤炭资源网 / 煤炭数据一点通 / 温岭市发展改革局 / 生意社 / 上海航运交易所 / 新华财经 / 证券时报 / 中新经纬 / 陆家嘴财经早餐 / 山东钢铁三季报 / 华菱钢铁三季报 / 上期所 / COMEX / LME / Reuters / Bloomberg / CNBC / 金融时报 / UKMTO"
  }
};

</script>
<script>
(function(){
  var D = window.HOTSPOT_DATA;
  var $ = function(s){return document.querySelector(s)};
  var esc = function(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')};
  var fmt = function(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')};
  if(!D){document.body.innerHTML='<p style="padding:48px">缺少 data.js</p>';return;}

  function num(s){ var m = String(s).match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
  function unit(s){ return String(s).replace(/-?\d+(\.\d+)?/,'').trim(); }

  $('#chip').innerHTML = '<i></i>' + esc(D.date) + ' · ' + esc(D.weekday) + ' · ' + esc(D.edition);
  $('#h1').innerHTML = String(D.thesis.title).split('').map(function(w,i){
    return '<span style="animation-delay:'+(i*55)+'ms">'+esc(w)+'</span>';
  }).join('');
  $('#lede').innerHTML = fmt(D.thesis.body);
  $('#stats').innerHTML = D.stats.map(function(s){
    return '<div class="stat rv"><b data-n="'+esc(s.v)+'">'+esc(s.v)+'</b><span>'+esc(s.l)+'</span></div>';
  }).join('');

  $('#mls').innerHTML = D.mainlines.map(function(m){
    return '<article class="ml rv">'
      + '<div class="k">'+esc(m.no)+' · '+esc(m.tag)+'</div>'
      + '<h3>'+esc(m.title)+'</h3>'
      + '<p>'+esc(m.desc)+'</p>'
      + '<div class="m"><b data-n="'+esc(m.metric)+'">'+esc(m.metric)+'</b><span>'+esc(m.metricLabel)+'</span></div>'
      + '</article>';
  }).join('');

  $('#cards').innerHTML = D.construction.map(function(a){
    var mx = 1;
    a.metrics.forEach(function(m){ var v = num(m.v); if(v && v > mx) mx = v; });
    var metrics = a.metrics.map(function(m){
      var v = num(m.v), pct = v ? Math.max(8, Math.round(v / mx * 100)) : 0;
      return '<div class="mg"><b data-n="'+esc(m.v)+'">'+esc(m.v)+'</b><span>'+esc(m.l)+'</span>'
        + (v ? '<div class="trk"><i data-w="'+pct+'"></i></div>' : '') + '</div>';
    }).join('');
    var facts = a.facts.map(function(p){return '<p>'+fmt(p)+'</p>'}).join('');
    var angles = a.angles.map(function(g){
      return '<div class="ang"><k>'+esc(g.k)+'</k><p>'+fmt(g.d)+'</p></div>';
    }).join('');
    var ccs = a.coCreate.map(function(c,j){
      return '<div class="cc"><n>'+String(j+1).padStart(2,'0')+'</n><div>'
        + '<b>'+esc(c.t)+'</b><p>'+esc(c.d)+'</p><span class="need">'+esc(c.need)+'</span></div></div>';
    }).join('');
    return '<div class="card rv">'
      + '<div class="ch"><span class="idx">'+esc(a.id)+'</span><span class="tt">'+esc(a.title)+'</span><span class="ar"></span></div>'
      + '<div class="rate"><span>热度<span class="d">'
      +   [1,2,3,4,5].map(function(n){return '<i class="'+(n<=Math.round(a.heat)?'on':'')+'"></i>'}).join('')
      + '</span></span><span>星级 '+a.stars+'/5</span><span>'+esc(a.tag)+'</span></div>'
      + '<div class="bd"><div class="bd-in">'
      +   '<p class="lead">'+esc(a.lead)+'</p>'
      +   '<div class="src">'+esc(a.source)+'　'+esc(a.time)+'</div>'
      +   '<div class="blk"><div class="blk-h">事实</div><div class="facts">'+facts+'</div></div>'
      +   '<div class="blk"><div class="blk-h">关键数</div><div class="mgrid">'+metrics+'</div></div>'
      +   '<div class="blk"><div class="blk-h">多角度</div>'+angles+'</div>'
      +   '<div class="blk"><div class="blk-h">共创输出点</div>'+ccs+'</div>'
      +   '<div class="blk"><div class="shoot"><div class="lv"><b>'+a.shootability.level+'</b><span>'+esc(a.shootability.label)+'</span></div>'
      +     '<div class="nt">'+esc(a.shootability.note)+'</div></div></div>'
      +   '<div class="caut"><b>边界</b>　'+esc(a.caution)+'</div>'
      + '</div></div></div>';
  }).join('');

  setTimeout(function(){
    var c0 = document.querySelector('.card');
    if(c0) c0.classList.add('open');
  }, 900);

  document.addEventListener('click', function(e){
    var ch = e.target.closest ? e.target.closest('.ch') : null;
    if(!ch) return;
    var card = ch.parentNode;
    var was = card.classList.contains('open');
    card.classList.toggle('open');
    if(!was){
      setTimeout(function(){
        card.querySelectorAll('.trk i').forEach(function(b){ b.style.width = b.getAttribute('data-w') + '%'; });
        card.querySelectorAll('b[data-n]').forEach(function(b){ countUp(b); });
      }, 240);
    }
  });

  $('#plist').innerHTML = D.policy.map(function(p){
    return '<div class="ti rv">'
      + '<div class="hd"><span class="no">'+esc(p.no)+'</span><span class="tg">'+esc(p.tag)+'</span><span class="tm">'+esc(p.time)+'</span></div>'
      + '<div class="og">'+esc(p.org)+'</div>'
      + '<div class="nm">'+esc(p.name)+'</div>'
      + '<div class="co">'+esc(p.core)+'</div></div>';
  }).join('');

  $('#panoIntro').textContent = D.panorama.intro;
  var pm = [['world','国际'],['tech','科技'],['society','社会'],['business','财经']];
  $('#tabs').innerHTML = pm.map(function(m,i){
    return '<button data-k="'+m[0]+'" class="'+(i===0?'on':'')+'">'+m[1]+'</button>';
  }).join('');
  $('#panes').innerHTML = pm.map(function(m,i){
    var arr = D.panorama[m[0]] || [];
    return '<div class="pane '+(i===0?'on':'')+'" data-p="'+m[0]+'">'
      + arr.map(function(x){
          return '<div class="pi rv"><div class="t">'+esc(x.t)+'</div><div class="d">'+esc(x.d)+'</div>'
            + '<div class="lk"><b>与工业建筑的关系</b>　'+esc(x.link)+'</div></div>';
        }).join('') + '</div>';
  }).join('');
  $('#tabs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    [].slice.call(this.children).forEach(function(x){x.classList.remove('on')});
    b.classList.add('on');
    var k = b.getAttribute('data-k');
    [].slice.call(document.querySelectorAll('.pane')).forEach(function(p){
      p.classList.toggle('on', p.getAttribute('data-p') === k);
    });
    var els = document.querySelectorAll('.pane.on .rv');
    [].slice.call(els).forEach(function(el,i){
      el.classList.remove('in');
      setTimeout(function(){ el.classList.add('in'); }, 40 + i*60);
    });
  });

  $('#cgrid').innerHTML = D.coCreate.map(function(c){
    return '<article class="cgr rv">'
      + '<div class="tp"><span class="num">'+esc(c.no)+'</span><span class="fm">'+esc(c.from)+'</span></div>'
      + '<h3>'+esc(c.title)+'</h3>'
      + '<dl class="cf"><dt>素材来自</dt><dd>'+esc(c.basis)+'</dd></dl>'
      + '<dl class="cf hi"><dt>要做什么</dt><dd>'+esc(c.build)+'</dd></dl>'
      + '<dl class="cf"><dt>差异化</dt><dd>'+esc(c.diff)+'</dd></dl>'
      + '<dl class="cf rk"><dt>风险</dt><dd>'+esc(c.risk)+'</dd></dl></article>';
  }).join('');

  var F = D.finance;
  $('#fnote').innerHTML = '<div class="fnote">'+esc(F.note)+'</div>';
  $('#dgrid').innerHTML = F.snapshot.map(function(d){
    return '<div class="dc rv"><div class="k">'+esc(d.k)+'</div><div class="v '+d.dir+'">'+esc(d.v)+'</div><div class="n">'+esc(d.n)+'</div></div>';
  }).join('');
  $('#slist').innerHTML = F.structure.map(function(s){
    return '<div class="srow rv"><b>'+esc(s.t)+'</b><p>'+esc(s.d)+'</p></div>';
  }).join('');
  $('#invest').innerHTML = '<h4>'+esc(F.invest.title)+'</h4><div class="sb">只占本板块一小块</div>'
    + F.invest.items.map(function(i){ return '<div class="irow"><k>'+esc(i.k)+'</k><p>'+esc(i.v)+'</p></div>'; }).join('')
    + '<div class="tl2">'+esc(F.invest.tail)+'</div>';

  var mk = {up:'▲',flat:'─',down:'▼'};
  $('#tlist').innerHTML = D.recent.map(function(r){
    return '<div class="trow rv"><div class="tr '+r.trend+'">'+mk[r.trend]+'</div>'
      + '<div><div class="tp">'+esc(r.topic)+'<em>SINCE '+esc(r.since)+'</em></div>'
      + '<div class="st">'+esc(r.status)+'</div></div></div>';
  }).join('');

  $('#fnote2').textContent = D.foreign.note;
  var tone = {green:'var(--down)',yellow:'var(--a3)',red:'var(--up)'};
  var fk = [['bloomberg','BLOOMBERG'],['reuters','REUTERS'],['cnbc','CNBC']];
  $('#fgrid').innerHTML = fk.map(function(k){
    return '<div class="fsrc">'+k[1]+'</div>'
      + (D.foreign[k[0]]||[]).map(function(f){
          return '<div class="fi rv">'
            + '<div class="en"><i style="background:'+(tone[f.tone]||'var(--tx3)')+'"></i><span>'+esc(f.en)+'</span></div>'
            + '<div class="zh">'+esc(f.zh)+'</div>'
            + '<div class="hint">点一下看中文</div></div>';
        }).join('');
  }).join('');
  document.addEventListener('click', function(e){
    var fi = e.target.closest ? e.target.closest('.fi') : null;
    if(fi) fi.classList.toggle('show');
  });

  $('#foot').innerHTML = '<p><b>来源</b>　'+esc(D.footer.sources)+'</p>'
    + '<p><b>说明</b>　'+esc(D.footer.note)+'</p>'
    + '<p class="end">事实标来源，判断标角度，两者分开写。</p>';
  $('#tbDate').textContent = D.date;

  function countUp(el){
    if(el.dataset.done) return; el.dataset.done = '1';
    var raw = el.getAttribute('data-n'), v = num(raw);
    if(v === null) return;
    var u = unit(raw);
    var dm = String(raw).match(/-?\d+\.(\d+)/);
    var dec = dm ? dm[1].length : 0;
    var t0 = null, dur = 900;
    function step(t){
      if(!t0) t0 = t;
      var p = Math.min(1, (t - t0) / dur);
      var e = 1 - Math.pow(1 - p, 3);
      el.textContent = (v * e).toFixed(dec) + (u ? ' ' + u : '');
      if(p < 1) requestAnimationFrame(step); else el.textContent = raw;
    }
    requestAnimationFrame(step);
  }

  var rvs = [].slice.call(document.querySelectorAll('.rv'));
  if('IntersectionObserver' in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(!e.isIntersecting) return;
        var el = e.target;
        var sibs = [].slice.call(el.parentNode.children).filter(function(x){return x.classList.contains('rv')});
        el.style.transitionDelay = Math.min(sibs.indexOf(el), 5) * 70 + 'ms';
        el.classList.add('in');
        io.unobserve(el);
        [].slice.call(el.querySelectorAll('b[data-n]')).forEach(countUp);
        [].slice.call(el.querySelectorAll('.trk i')).forEach(function(b){ b.style.width = b.getAttribute('data-w') + '%'; });
      });
    },{rootMargin:'0px 0px -6% 0px',threshold:.06});
    rvs.forEach(function(el){ io.observe(el); });
  } else {
    rvs.forEach(function(el){ el.classList.add('in'); });
  }

  var bar = $('#bar'), tb = $('#topbar'), fab = $('#fab');
  var ids = ['ml','ct','pl','pn','cc','fn','tk','fr'];
  var links = [].slice.call(document.querySelectorAll('#jump a'));
  function onScroll(){
    var h = document.documentElement;
    var p = h.scrollTop / Math.max(1, (h.scrollHeight - h.clientHeight));
    bar.style.width = (p * 100) + '%';
    tb.classList.toggle('show', h.scrollTop > 260);
    fab.classList.toggle('show', h.scrollTop > 700);
    var y = h.scrollTop + 160, cur = 'ml';
    ids.forEach(function(id){ var s = document.getElementById(id); if(s && s.offsetTop <= y) cur = id; });
    links.forEach(function(a){ a.classList.toggle('on', a.getAttribute('href') === '#'+cur); });
  }
  window.addEventListener('scroll', onScroll, {passive:true});
  onScroll();

  fab.addEventListener('click', function(e){
    e.preventDefault();
    window.scrollTo({top:0,behavior:'smooth'});
  });

  window.addEventListener('load', function(){
    setTimeout(function(){
      $('#splash').classList.add('off');
      [].slice.call(document.querySelectorAll('.hero .rv')).forEach(function(el){ el.classList.add('in'); });
      [].slice.call(document.querySelectorAll('.stat b[data-n]')).forEach(countUp);
    }, 380);
  });
})();
</script>
</body>
</html>
